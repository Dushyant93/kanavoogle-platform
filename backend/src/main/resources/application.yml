server:
  port: 8080
spring:
  application:
    name: kanavoogle-skills-platform
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/kanavoogle}
      auto-index-creation: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30m
app:
  security:
    jwt-secret: ${JWT_SECRET:replace-this-with-at-least-32-random-characters}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:480}
    cookie-secure: ${COOKIE_SECURE:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088}
  llm:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4.1-mini}
